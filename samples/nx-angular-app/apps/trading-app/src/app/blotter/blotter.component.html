<div class="d-flex flex-column h-100">
  <!-- Blotter Toolbar -->
  <div class="d-flex justify-content-between align-items-center px-2 py-1 border-bottom border-secondary"
       style="background-color: #111827; font-size: 0.65rem;">
    <div class="d-flex align-items-center gap-2">
      <span class="text-secondary text-uppercase" style="letter-spacing: 0.5px; font-weight: 600;">
        Trade Blotter
      </span>
      <span class="badge bg-info" style="font-size: 0.55rem;">LIVE</span>
      <span class="badge bg-secondary" style="font-size: 0.55rem;">{{ tradeCount }} trades</span>
    </div>
    <div class="d-flex align-items-center gap-3" style="font-family: 'Courier New', monospace;">
      <span class="text-secondary">
        Total Notional:
        <span class="text-light fw-bold">
          ${{ totalNotional.toLocaleString('en-US', { maximumFractionDigits: 0 }) }}
        </span>
      </span>
    </div>
  </div>

  <!-- AG Grid - Trade Blotter -->
  <div class="flex-grow-1">
    <ag-grid-angular
      class="ag-theme-alpine-dark w-100 h-100"
      [rowData]="trades"
      [columnDefs]="columnDefs"
      [gridOptions]="gridOptions"
      (gridReady)="onGridReady($event)"
      style="height: calc(100vh - 90px);"
    ></ag-grid-angular>
  </div>

  <!-- Status Bar -->
  <div class="d-flex justify-content-between px-2 py-0 border-top border-secondary"
       style="background-color: #0d1117; font-size: 0.58rem; color: #4a5568; line-height: 1.8;">
    <span>Trades: {{ tradeCount }} | Auto-refresh: 5s</span>
    <span>Account: GEA-789456 | Session: {{ trades.length > 0 ? (trades[0].executedAt | date:'yyyy-MM-dd') : '--' }}</span>
  </div>
</div>
