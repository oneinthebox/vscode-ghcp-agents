<div class="card bg-dark border-secondary h-100" style="font-size: 0.7rem;">
  <div class="card-body p-2">
    <div class="text-secondary text-uppercase mb-1" style="font-size: 0.6rem; letter-spacing: 0.5px;">
      {{ label }}
    </div>
    <div class="d-flex align-items-baseline justify-content-between">
      <span class="fw-bold" [style.color]="accentColor" style="font-size: 1rem; font-family: 'Courier New', monospace;">
        {{ prefix }}{{ value | numberFormat:format }}{{ suffix }}
      </span>
      @if (changeValue !== undefined) {
        <span [class]="changeClass" style="font-size: 0.65rem; font-family: 'Courier New', monospace;">
          {{ changeArrow }} {{ changeValue | numberFormat:'currency' }}
          @if (changePercent !== undefined) {
            <span class="ms-1">({{ changePercent | numberFormat:'percent' }})</span>
          }
        </span>
      }
    </div>
  </div>
</div>
