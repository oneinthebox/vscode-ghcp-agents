<nav class="navbar navbar-expand navbar-dark bg-dark border-bottom border-secondary py-0 px-2" style="font-size: 0.75rem;">
  <div class="container-fluid p-0">
    <a class="navbar-brand py-0 me-3" style="font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; color: #00d4aa;">
      {{ appTitle }}
    </a>
    <ul class="navbar-nav me-auto">
      @for (link of navLinks; track link.path) {
        <li class="nav-item">
          <a class="nav-link py-1 px-2" [routerLink]="link.path" routerLinkActive="active"
             style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;">
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
    <div class="d-flex align-items-center text-light" style="font-size: 0.65rem; font-family: 'Courier New', monospace;">
      <span class="me-3 text-success">
        <span class="me-1">&#9679;</span>CONNECTED
      </span>
      <span class="text-secondary">
        {{ currentTime | date:'HH:mm:ss' }} EST
      </span>
    </div>
  </div>
</nav>
