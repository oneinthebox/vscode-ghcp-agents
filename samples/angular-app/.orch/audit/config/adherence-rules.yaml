# ORCH Audit Adherence Rules
# Post-session checks that verify generated code follows instruction rules.
# Each rule defines a grep-based check and severity level.
# Severity: high = must fix, medium = should fix, low = consider

angular:

  # ── Component Architecture ──
  - id: onpush_change_detection
    description: "All components must use OnPush change detection"
    check_type: absence
    pattern: "changeDetection.*OnPush"
    file_glob: "**/*.component.ts"
    severity: high
    message: "Component missing OnPush change detection"

  - id: standalone_components
    description: "All components must be standalone (Angular 18+)"
    check_type: absence
    pattern: "standalone:\\s*true"
    file_glob: "**/*.component.ts"
    severity: high
    message: "Component not declared as standalone"

  # ── TypeScript Strictness ──
  - id: no_any_type
    description: "No 'any' type annotations"
    check_type: presence
    pattern: ":\\s*any\\b"
    file_glob: "**/*.ts"
    severity: medium
    message: "'any' type found — use specific type or 'unknown'"

  - id: no_enum
    description: "No TypeScript enums — use const objects"
    check_type: presence
    pattern: "^\\s*export\\s+enum\\s+"
    file_glob: "**/*.ts"
    severity: medium
    message: "TypeScript enum found — use 'as const' object pattern instead"

  # ── RxJS ──
  - id: no_manual_subscribe
    description: "No manual .subscribe() calls in components"
    check_type: presence
    pattern: "\\.subscribe\\("
    file_glob: "**/*.component.ts"
    severity: medium
    message: "Manual .subscribe() found — use async pipe instead"

  - id: no_nested_subscribe
    description: "No nested subscribes"
    check_type: presence
    pattern: "\\.subscribe\\([^)]*\\{[\\s\\S]*\\.subscribe\\("
    file_glob: "**/*.ts"
    severity: high
    message: "Nested .subscribe() found — use switchMap/concatMap/mergeMap"

  # ── Internal Library Usage ──
  - id: no_console_log
    description: "No console.log in production code"
    check_type: presence
    pattern: "console\\.(log|warn|error|info|debug)"
    file_glob: "**/*.ts"
    severity: medium
    message: "console.log found — use @yourorg/elevate LoggingService"

  - id: no_hardcoded_urls
    description: "No hardcoded API URLs"
    check_type: presence
    pattern: "(https?://|http://)[a-zA-Z0-9].*\\.(com|io|net|org|internal)"
    file_glob: "**/*.service.ts"
    severity: medium
    message: "Hardcoded URL found — use @yourorg/elevate ConfigService"

  - id: no_localstorage
    description: "No direct localStorage/sessionStorage access"
    check_type: presence
    pattern: "(localStorage|sessionStorage)\\."
    file_glob: "**/*.ts"
    severity: medium
    message: "Direct storage access found — use @yourorg/elevate PreferencesService"

  - id: use_org_components
    description: "No raw PrimeNG p- components — use @yourorg/hds or elevate-common"
    check_type: presence
    pattern: "<p-(button|table|dialog|input|dropdown)"
    file_glob: "**/*.html"
    severity: medium
    message: "Raw PrimeNG component found — use @yourorg/elevate-common or @yourorg/hds equivalent"

  # ── HTML / Templates ──
  - id: no_inline_styles
    description: "No inline styles in templates"
    check_type: presence
    pattern: "\\[style\\]|style=\""
    file_glob: "**/*.html"
    severity: medium
    message: "Inline style found — use CSS classes"

  - id: img_alt_required
    description: "All img tags must have alt attribute"
    check_type: presence
    pattern: "<img(?![^>]*alt=)"
    file_glob: "**/*.html"
    severity: medium
    message: "Image missing alt attribute — required for accessibility"

  # ── CSS / SCSS ──
  - id: no_important
    description: "No !important in styles"
    check_type: presence
    pattern: "!important"
    file_glob: "**/*.scss"
    severity: medium
    message: "!important found — restructure selectors instead"

  - id: no_hardcoded_colors
    description: "No hardcoded color values — use HDS tokens"
    check_type: presence
    pattern: "(color|background|border-color):\\s*#[0-9a-fA-F]"
    file_glob: "**/*.scss"
    severity: medium
    message: "Hardcoded color found — use var(--hds-*) design token"

  # ── Testing ──
  - id: no_karma_config
    description: "No Karma configuration — use Jest"
    check_type: presence
    pattern: "karma\\.conf"
    file_glob: "**/*"
    severity: low
    message: "Karma config found — migrate to Jest using /angular-migrate-jest"

  - id: test_data_testid
    description: "E2E selectors should use data-testid"
    check_type: absence
    pattern: "data-testid"
    file_glob: "**/*.html"
    severity: low
    message: "No data-testid attributes found — add for e2e test selectors"

backend-springboot:
  - id: no_field_injection
    description: "No @Autowired field injection"
    check_type: presence
    pattern: "@Autowired"
    file_glob: "**/*.java"
    severity: high
    message: "@Autowired field injection found — use constructor injection"

  - id: constructor_injection
    description: "Services should use constructor injection with final fields"
    check_type: absence
    pattern: "private final"
    file_glob: "**/*Service.java"
    severity: medium
    message: "Service missing 'private final' fields — use constructor injection"

  - id: no_raw_sql
    description: "No raw SQL strings in repository classes"
    check_type: presence
    pattern: "nativeQuery\\s*=\\s*true"
    file_glob: "**/*Repository.java"
    severity: medium
    message: "Native query found — prefer JPQL or Spring Data method naming"

backend-fastapi:
  - id: async_endpoints
    description: "Endpoints should be async"
    check_type: absence
    pattern: "async def"
    file_glob: "**/routes/*.py"
    severity: medium
    message: "Endpoint not async — use 'async def' for non-blocking I/O"

  - id: pydantic_models
    description: "Request/response should use Pydantic models"
    check_type: presence
    pattern: "def.*\\(.*dict\\)"
    file_glob: "**/routes/*.py"
    severity: medium
    message: "Raw dict parameter found — use Pydantic model"
