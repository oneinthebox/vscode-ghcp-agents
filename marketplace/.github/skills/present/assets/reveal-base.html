<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css">
  <style>
    /* ── HDS Theme Override ── */
    :root {
      --hds-surface-primary: #0a0e17;
      --hds-surface-secondary: #141b2d;
      --hds-surface-tertiary: #1e2a3a;
      --hds-text-primary: #e0e6ed;
      --hds-text-secondary: #8892a4;
      --hds-text-muted: #5a6577;
      --hds-accent-primary: #3b82f6;
      --hds-accent-success: #22c55e;
      --hds-accent-warning: #f59e0b;
      --hds-accent-error: #ef4444;
      --hds-font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --hds-font-family-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --hds-border-default: #2a3444;
      --hds-border-radius: 8px;
    }

    .reveal {
      font-family: var(--hds-font-family);
      color: var(--hds-text-primary);
    }

    .reveal .slides {
      text-align: left;
    }

    .reveal .slides section {
      padding: 40px;
    }

    /* Title slide */
    .reveal .slides section.title-slide {
      text-align: center;
    }

    .reveal .slides section.title-slide h1 {
      font-size: 2.2em;
      color: var(--hds-text-primary);
      margin-bottom: 0.3em;
    }

    .reveal .slides section.title-slide .subtitle {
      font-size: 1.1em;
      color: var(--hds-text-secondary);
    }

    .reveal .slides section.title-slide .date {
      font-size: 0.8em;
      color: var(--hds-text-muted);
      margin-top: 2em;
    }

    /* Section divider */
    .reveal .slides section.section-slide {
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reveal .slides section.section-slide h2 {
      font-size: 2em;
      color: var(--hds-accent-primary);
      border-bottom: 3px solid var(--hds-accent-primary);
      padding-bottom: 0.3em;
      display: inline-block;
    }

    /* Content */
    .reveal h1, .reveal h2, .reveal h3 {
      color: var(--hds-text-primary);
      font-weight: 600;
    }

    .reveal h2 { font-size: 1.6em; }
    .reveal h3 { font-size: 1.2em; color: var(--hds-accent-primary); }

    .reveal p, .reveal li {
      font-size: 0.85em;
      line-height: 1.6;
      color: var(--hds-text-secondary);
    }

    /* Tables */
    .reveal table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75em;
      margin: 1em 0;
    }

    .reveal table th {
      background: var(--hds-surface-tertiary);
      color: var(--hds-accent-primary);
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid var(--hds-accent-primary);
    }

    .reveal table td {
      padding: 6px 12px;
      border-bottom: 1px solid var(--hds-border-default);
      color: var(--hds-text-primary);
    }

    .reveal table tr:hover td {
      background: var(--hds-surface-secondary);
    }

    /* Code blocks */
    .reveal pre {
      background: var(--hds-surface-secondary);
      border: 1px solid var(--hds-border-default);
      border-radius: var(--hds-border-radius);
      padding: 16px;
      font-size: 0.7em;
    }

    .reveal code {
      font-family: var(--hds-font-family-mono);
      color: var(--hds-accent-primary);
    }

    /* Mermaid diagrams */
    .reveal .mermaid {
      text-align: center;
    }

    .reveal .mermaid svg {
      max-width: 100%;
      max-height: 500px;
    }

    /* Metrics cards */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 1em 0;
    }

    .metric-card {
      background: var(--hds-surface-secondary);
      border: 1px solid var(--hds-border-default);
      border-radius: var(--hds-border-radius);
      padding: 20px;
      text-align: center;
    }

    .metric-card .value {
      font-size: 2em;
      font-weight: 700;
      color: var(--hds-text-primary);
    }

    .metric-card .label {
      font-size: 0.8em;
      color: var(--hds-text-muted);
      margin-top: 4px;
    }

    .metric-card .trend {
      font-size: 0.75em;
      margin-top: 4px;
    }

    .metric-card .trend.up { color: var(--hds-accent-success); }
    .metric-card .trend.down { color: var(--hds-accent-error); }

    /* Status indicators */
    .status-ok { color: var(--hds-accent-success); }
    .status-warn { color: var(--hds-accent-warning); }
    .status-fail { color: var(--hds-accent-error); }

    /* Progress bar */
    .progress-bar {
      background: var(--hds-surface-tertiary);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar .fill {
      background: var(--hds-accent-primary);
      height: 100%;
      transition: width 0.3s;
    }

    /* Footer */
    .reveal .slide-footer {
      position: absolute;
      bottom: 12px;
      left: 40px;
      font-size: 0.6em;
      color: var(--hds-text-muted);
    }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      {{SLIDES}}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    // Initialize mermaid with HDS dark theme
    mermaid.initialize({
      startOnLoad: true,
      theme: 'dark',
      themeVariables: {
        primaryColor: '#3b82f6',
        primaryTextColor: '#e0e6ed',
        primaryBorderColor: '#2a3444',
        lineColor: '#5a6577',
        secondaryColor: '#141b2d',
        tertiaryColor: '#1e2a3a',
        fontFamily: 'Inter, sans-serif',
      }
    });

    // Initialize reveal.js
    Reveal.initialize({
      hash: true,
      slideNumber: true,
      transition: 'fade',
      transitionSpeed: 'fast',
      width: 1280,
      height: 720,
      margin: 0.04,
    });
  </script>
</body>
</html>
