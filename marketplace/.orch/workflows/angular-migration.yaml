# ORCH Workflow: Angular Migration
# Read by the @angular coordinator when triage matches trigger keywords.
# Each phase is executed sequentially with optional pre/post checks, checkpoints, and verification.

name: angular-migration
description: "Upgrade Angular across major versions with pattern migrations"
trigger: "upgrade|migrate|update angular"
report:
  template: migrate-report
  title: "Angular {{from}} → {{to}} Upgrade"
  attribution: "@angular → @angular-planner → @angular-engineer → @angular-verifier"

phases:
  - name: Scan dependencies
    id: scan-deps
    phase_id: "001"
    agent: planner
    skill: /angular-scan-deps
    depends_on: []
    checkpoint: false
    verify: false
    approval: none
    collect:
      - before-versions
    report-section: "Before vs After"
    on-failure: stop

  - name: Compatibility check
    id: compat
    phase_id: "002"
    agent: planner
    skill: /angular-compatibility
    depends_on: ["001"]
    checkpoint: false
    verify: false
    approval: auto=safe
    collect:
      - upgrade-path
      - phase-plan
    report-section: "Phase Timeline"
    on-failure: stop

  - name: Upgrade TypeScript
    id: upgrade-ts
    phase_id: "003"
    agent: engineer
    skill: /angular-migrate-version
    execution_type: ai
    args: --scope typescript-only
    depends_on: ["002"]
    checkpoint: true
    verify: true
    approval: auto=safe
    collect:
      - files-changed
      - duration
      - build-status
      - test-status
    report-section: "Phase Details"
    on-failure: pause

  - name: Upgrade Angular core
    id: upgrade-angular
    phase_id: "004"
    agent: engineer
    skill: /angular-migrate-version
    execution_type: ai
    args: --scope angular-core
    depends_on: ["003"]
    checkpoint: true
    verify: true
    approval: auto=safe
    collect:
      - files-changed
      - duration
      - build-status
      - test-status
    report-section: "Phase Details"
    on-failure: rollback-to-checkpoint

  - name: Standalone migration
    id: standalone
    phase_id: "005"
    agent: engineer
    skill: /angular-migrate-standalone
    execution_type: ai
    min_target_version: 17
    depends_on: ["004"]
    pre-check:
      skill: /angular-scan-arch
      args: --counts-only
      capture: before-patterns
    post-check:
      skill: /angular-scan-arch
      args: --counts-only
      capture: after-patterns
    checkpoint: true
    verify: true
    approval: auto=safe
    collect:
      - files-changed
      - duration
      - pattern-delta
    report-section: "Phase Details"
    on-failure: rollback-to-checkpoint

  - name: Control flow migration
    id: control-flow
    phase_id: "006"
    agent: engineer
    skill: /angular-migrate-control-flow
    execution_type: ai
    min_target_version: 17
    depends_on: ["005"]
    pre-check:
      skill: /angular-scan-arch
      args: --counts-only
      capture: before-patterns
    post-check:
      skill: /angular-scan-arch
      args: --counts-only
      capture: after-patterns
    checkpoint: true
    verify: true
    approval: auto=safe
    collect:
      - files-changed
      - duration
      - pattern-delta
    report-section: "Phase Details"
    on-failure: rollback-to-checkpoint

  - name: Signals migration
    id: signals
    phase_id: "007"
    agent: engineer
    skill: /angular-migrate-signals
    execution_type: ai
    min_target_version: 19
    depends_on: ["006"]
    pre-check:
      skill: /angular-scan-arch
      args: --counts-only
      capture: before-patterns
    post-check:
      skill: /angular-scan-arch
      args: --counts-only
      capture: after-patterns
    checkpoint: true
    verify: true
    approval: auto=safe
    collect:
      - files-changed
      - duration
      - pattern-delta
    report-section: "Phase Details"
    on-failure: rollback-to-checkpoint

  - name: Third-party compatibility
    id: third-party
    phase_id: "008"
    agent: engineer
    skill: /angular-migrate-version
    execution_type: ai
    args: --scope third-party
    depends_on: ["007"]
    checkpoint: true
    verify: true
    approval: auto=safe
    collect:
      - files-changed
      - duration
    report-section: "Phase Details"
    on-failure: pause

  - name: Final verification
    id: final-verify
    phase_id: "009"
    agent: verifier
    depends_on: ["008"]
    skills:
      - /angular-test-unit
      - /angular-test-e2e
      - /angular-test-lint
      - /angular-review
    checkpoint: false
    verify: false
    approval: none
    collect:
      - build-status
      - test-results
      - lint-results
      - adherence-score
      - review-findings
    report-section: "Verification Results"
    on-failure: report-as-partial

  - name: Post-scan
    id: post-scan
    phase_id: "010"
    agent: planner
    skill: /angular-scan-deps
    depends_on: ["009"]
    checkpoint: false
    verify: false
    approval: none
    collect:
      - after-versions
      - pattern-counts
    report-section: "Compatibility Changes"
    on-failure: continue

post-workflow:
  report:
    sections:
      - "Before vs After"
      - "Phase Timeline"
      - "Phase Details"
      - "Verification Results"
      - "Compatibility Changes"
      - "Risk Items"
      - "Git History"
      - "Recommendations"
  git:
    message: "migrate: Angular {{from}} → {{to}} complete"
    tag: "migrate/angular-{{to}}-{{date}}"
  notify:
    status-bar: "Migration complete — {{phases-passed}}/{{phases-total}} phases"
