# ORCH Audit Boundaries Configuration
# Defines allowed tools and file scope per agent.
# The audit framework enforces these at runtime via hooks.

agents:
  orch:
    # Master orchestrator — routes to domain agents, runs pre-flight
    allowed_tools:
      - codebase
    allowed_scope:
      - ".orch/**"
      - ".github/agents/**"
      - ".github/skills/**"
      - "package.json"
      - "angular.json"
      - "nx.json"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  angular:
    # Coordinator — routes to sub-agents, writes workflow state, runs git checkpoints
    allowed_tools:
      - codebase
      - terminal
      - edit
    allowed_scope:
      - "src/**"
      - "libs/**"
      - "apps/**"
      - "angular.json"
      - "tsconfig*.json"
      - "nx.json"
      - "project.json"
      - "package.json"
      - ".orch/references/**"
      - ".orch/mocks/**"
      - ".orch/workflow/**"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  angular-planner:
    allowed_tools:
      - codebase
      - terminal
    allowed_scope:
      # Read-only, all source files
      - "src/**"
      - "libs/**"
      - "apps/**"
      - "angular.json"
      - "tsconfig*.json"
      - "nx.json"
      - "project.json"
      - "package.json"
      - "jest.config.*"
      - "playwright.config.*"
      - "cypress.config.*"
      - ".orch/references/**"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  angular-engineer:
    allowed_tools:
      - codebase
      - terminal
      - edit
    allowed_scope:
      - "src/**/*.ts"
      - "src/**/*.html"
      - "src/**/*.scss"
      - "src/**/*.spec.ts"
      - ".orch/mocks/**"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  angular-verifier:
    allowed_tools:
      - codebase
      - terminal
    allowed_scope:
      # Read-only source, write test files only
      - "src/**"
      - "libs/**"
      - "apps/**"
      - "angular.json"
      - "tsconfig*.json"
      - "package.json"
      - "src/**/*.spec.ts"
      - "libs/**/*.spec.ts"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  orch-preflight:
    allowed_tools:
      - codebase
      - terminal
    allowed_scope:
      # Read-only: .orch/**, package.json, angular.json
      - ".orch/**"
      - "package.json"
      - "angular.json"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  docs:
    allowed_tools:
      - codebase
      - terminal
      - fetch
      - edit
    allowed_scope:
      - ".orch/references/**"
      - ".orch/registry.yaml"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  audit:
    allowed_tools:
      - codebase
      - terminal
    allowed_scope:
      - ".orch/audit/**"
      - ".github/skills/*/SKILL.md"    # read skill definitions for benchmark
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  local:
    allowed_tools:
      - codebase
      - terminal
      - edit
    allowed_scope:
      - ".orch/mocks/**"
      - ".orch/config.yaml"
      - ".env"
      - ".env.*"
      - ".nvmrc"
      - ".node-version"
      - "docker-compose.yml"
      - "docker-compose.yaml"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"

  # ── Sub-Agent Workers (internal, not user-invocable) ──

  migrate-worker:
    allowed_tools:
      - codebase
      - terminal
      - edit
    allowed_scope:
      - "src/**/*.ts"
      - "src/**/*.html"
      - "src/**/*.scss"
      - "src/**/*.spec.ts"
      - "libs/**/*.ts"
      - "libs/**/*.html"
      - "libs/**/*.scss"
      - "angular.json"
      - "tsconfig*.json"
      - "package.json"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  doc-convert-worker:
    allowed_tools:
      - codebase
      - terminal
      - fetch
      - edit
    allowed_scope:
      - ".orch/references/**"
      - ".orch/references/staging/**"
      - "src/**"
      - "app/**"
      - "lib/**"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  # ── Future Domain Agents ──

  backend-springboot:
    allowed_tools:
      - codebase
      - terminal
      - edit
    allowed_scope:
      - "src/**/*.java"
      - "src/**/*.xml"
      - "src/**/*.properties"
      - "src/**/*.yml"
      - "pom.xml"
      - "build.gradle"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  backend-fastapi:
    allowed_tools:
      - codebase
      - terminal
      - edit
    allowed_scope:
      - "src/**/*.py"
      - "app/**/*.py"
      - "tests/**/*.py"
      - "requirements.txt"
      - "pyproject.toml"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  ops-ci:
    allowed_tools:
      - codebase
      - terminal
      - edit
    allowed_scope:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "Dockerfile"
      - "docker-compose*.yml"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"

  ops-cd:
    allowed_tools:
      - codebase
      - terminal
      - edit
    allowed_scope:
      - "deploy/**"
      - "infra/**"
      - "k8s/**"
      - "helm/**"
    blocked_commands:
      - "rm -rf"
      - "git push --force"
      - "git reset --hard"
      - "npm publish"
      - "yarn publish"
      - "kubectl delete"
