# ORCH Documentation Registry
# Central source of truth for all documentation sources.
# Managed by the @docs agent via /docs-fetch, /docs-status, /docs-refresh skills.
#
# Supported formats:
#   html, openapi, pdf, confluence, storybook, codebase,
#   jsdoc, tsdoc, compodoc, pydoc, javadoc
#
# Naming convention: output files use `-guide.md` suffix
#
# Ownership: managed_by field tracks source ownership
#   "pack:{domain}" — managed by a doc pack, updated via orch update
#   "user"          — added by the project team, never overwritten

version: 1

